name: Build APK

on:
  push:
    branches: [claude/great-keller-hdebr9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: make SDK="$ANDROID_HOME" JAVA_HOME="$JAVA_HOME" all
      - uses: actions/upload-artifact@v4
        with:
          name: amtv-apk
          path: build/amtv.apk
